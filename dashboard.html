<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff dashboard (demo) – Campus Support</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="js/ui.js"></script>
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <div class="staff-banner" role="note">Staff view, demo only. Contains student emails and risk levels; no real login protects this page.</div>

  <main id="main">
    <div class="container">
      <h1 class="page-title" tabindex="-1" id="dash-title">Counselor dashboard</h1>
      <p class="muted" id="storage-note" hidden>Your browser isn't saving data between pages, so this dashboard may be empty.</p>

      <div class="tiles" id="tiles" aria-label="Summary"></div>

      <section class="card workload" aria-labelledby="wl-h">
        <h2 id="wl-h">Counselor workload</h2>
        <div id="workload"></div>
      </section>

      <div class="toolbar">
        <div class="chips" role="group" aria-label="Filter by risk level" id="chips"></div>
        <label class="visually-hidden" for="search">Search by email</label>
        <input class="search" id="search" type="search" placeholder="Search by email" autocomplete="off">
        <button type="button" class="btn btn-secondary" id="clear-btn">Clear demo data</button>
      </div>
      <p class="muted" id="count-text" aria-live="polite"></p>

      <div class="table-wrap">
        <table>
          <caption class="visually-hidden">Student check-ins</caption>
          <thead><tr id="head-row"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="empty" hidden></p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
